# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: bensontuan-frt/ctea-homepage

# Local repo media (e.g. logo). CMS image fields below prefer R2.
# media_folder: /public/media
# public_folder: /media

# Cloudflare R2 — fill access_key_id, account_id, public_url after bucket setup.
# Secret Access Key is entered in the CMS UI (never store it here).
# Docs: https://sveltiacms.app/en/docs/media/cloudflare-r2
media_libraries:
  cloudflare_r2: &r2
    access_key_id: 55c59e32643f220ede0d3494ea1a9c35
    bucket: ctea
    account_id: bb7bdac21855a417e8ed043d3efc6d01
    # Dev: https://pub-xxxx.r2.dev | Prod: https://media.your-domain.com
    public_url: https://pub-2bb6dae8f23943f19fe4d549fdfd5f2d.r2.dev
    prefix: homepage/

collections:
  - name: pages
    label: 首頁
    files:
      - name: homepage
        label: 首頁輪播
        file: content/homepage.json
        format: json
        fields:
          - name: carousel
            label: 首頁焦點輪播
            widget: object
            fields:
              - name: slides
                label: 輪播內容
                label_singular: 輪播內容
                widget: list
                min: 1
                max: 6
                summary: '{{fields.titleLine1}}{{fields.titleLine2}}'
                fields:
                  - { label: 英文分類標示, name: eyebrow, widget: string }
                  - { label: 主標題第一行, name: titleLine1, widget: string }
                  - { label: 金色主標題第二行, name: titleLine2, widget: string }
                  - { label: 說明文字, name: description, widget: text }
                  - { label: CTA 文字, name: ctaLabel, widget: string }
                  - { label: CTA 連結, name: ctaHref, widget: string }
                  - label: 背景圖片
                    name: image
                    widget: image
                    media_libraries:
                      cloudflare_r2:
                        <<: *r2
                        prefix: homepage/landingpage/
                  - { label: 圖片替代文字, name: imageAlt, widget: string }
                  - label: 圖片焦點
                    name: imagePosition
                    widget: select
                    default: center center
                    options:
                      - { label: 置中, value: center center }
                      - { label: 靠左, value: left center }
                      - { label: 靠右, value: right center }
                      - { label: 底部置中, value: center bottom }
      - name: news
        label: 最新消息
        file: content/news.json
        format: json
        fields:
          - label: 焦點消息圖片
            name: featuredImage
            widget: image
            media_libraries:
              cloudflare_r2:
                <<: *r2
                prefix: homepage/landingpage/
          - { label: 焦點消息圖片替代文字, name: featuredImageAlt, widget: string }
      - name: social
        label: 馬術現場
        file: content/social.json
        format: json
        fields:
          - label: 區塊背景圖片
            name: backgroundImage
            widget: image
            media_libraries:
              cloudflare_r2:
                <<: *r2
                prefix: homepage/landingpage/

  - name: about
    label: 關於協會
    files:
      - name: history
        label: 協會歷史
        file: content/about/history.md
        format: yaml-frontmatter
        body_field:
          key: content
        fields:
          - { label: 英文標示, name: eyebrow, widget: string }
          - { label: 標題, name: title, widget: string }
          - { label: 下一頁連結文字, name: nextLabel, widget: string }
          - label: 下一頁連結
            name: nextTo
            widget: select
            options:
              - { label: 協會宗旨, value: /about/mission }
              - { label: 組織章程, value: /about/constitution }
              - { label: 奮鬥願景, value: /about/vision }
              - { label: 協會歷史, value: /about/history }
          - name: timeline
            label: 歷史時間軸
            label_singular: 時間軸項目
            widget: list
            summary: '{{fields.year}} — {{fields.title}}'
            fields:
              - { label: 年份, name: year, widget: string }
              - { label: 標題, name: title, widget: string }
              - { label: 說明, name: description, widget: text }
          - { label: 內文, name: content, widget: richtext }

  - name: equestrian
    label: 馬術介紹
    files:
      - name: equestrian
        label: 馬術介紹頁面
        file: content/equestrian-page/page.md
        format: yaml-frontmatter
        fields:
          - { label: 英文標示, name: eyebrow, widget: string }
          - { label: 標題, name: title, widget: string }
          - { label: 導言, name: lead, widget: text }

  - name: equestrian_sections
    label: 馬術介紹章節
    label_singular: 章節
    folder: /content/equestrian
    create: true
    extension: md
    format: yaml-frontmatter
    body_field:
      key: content
    slug: '{{slug}}'
    summary: '{{order}} — {{title}}'
    sortable_fields: [order, title]
    fields:
      - { label: 排序, name: order, widget: number, value_type: int, min: 1 }
      - { label: 英文標示, name: eyebrow, widget: string }
      - { label: 標題, name: title, widget: string }
      - { label: 內文, name: content, widget: richtext }

  - name: event
    label: 活動看板（列表）
    files:
      - name: event
        label: 活動看板
        file: content/event.json
        format: json
        fields:
          - { label: 英文標示, name: eyebrow, widget: string }
          - { label: 標題, name: title, widget: string }
          - { label: 說明, name: description, widget: text }

  - name: events
    label: 活動看板（詳情）
    label_singular: 活動看板（詳情）
    folder: /content/events
    create: true
    extension: md
    format: yaml-frontmatter
    # Matches content-collections frontmatter body (`content` outside YAML).
    body_field:
      key: content
    slug: '{{slug}}'
    summary: '{{title}} — {{date}}'
    sortable_fields: [title, date, category, author]
    fields:
      - { label: 標題, name: title, widget: string }
      - label: 分類
        name: category
        widget: select
        options:
          - { label: 活動賽事, value: events }
          - { label: 行政會務, value: administration }
          - { label: 培訓講習, value: education }
          - { label: 國際資訊, value: international }
          - { label: 規章制度, value: rules }
          - { label: 其他公告, value: other }
      - label: 標籤
        name: tags
        widget: select
        multiple: true
        required: false
        options:
          - 2025全運
          - 大專盃
          - 亞洲錦標賽
          - FEI挑戰賽
          - 選手
          - 教練
          - 裁判
          - 會員單位
          - 證照
          - 證件申請
          - TUE
          - 藥檢
          - 收據
          - FEI
          - AEF
          - Quota
          - YOG
          - 規程
          - 秩序冊
          - 成績
          - 積分
          - 會議
          - 人事
          - 會費
          - 培訓
          - 講習
          - 活動
          - 緊急通知
          - 延期
          - 天氣
      - { label: 日期, name: date, widget: datetime, type: date }
      - { label: 作者, name: author, widget: string, required: false }
      - { label: 摘要, name: excerpt, widget: text, required: false }
      - { label: 內文, name: content, widget: richtext }
      - name: attachments
        label: 附件
        label_singular: 附件
        widget: list
        required: false
        fields:
          - { label: 檔名, name: name, widget: string }
          - label: 檔案
            name: url
            widget: file
            media_libraries:
              cloudflare_r2:
                <<: *r2
                prefix: homepage/events/
          - { label: 檔案大小, name: size, widget: string, required: false, hint: '例如 256 KB' }

  - name: posts
    label: Posts
    label_singular: Post
    folder: /content/posts
    create: true
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, type: date }
      - { label: Body, name: body, widget: richtext }
