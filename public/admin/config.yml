# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: bensontuan-frt/ctea-homepage

# Local repo media (e.g. logo). CMS image fields below prefer R2.
# media_folder: /public/media
# public_folder: /media

# Cloudflare R2 — fill access_key_id, account_id, public_url after bucket setup.
# Secret Access Key is entered in the CMS UI (never store it here).
# Docs: https://sveltiacms.app/en/docs/media/cloudflare-r2
media_libraries:
  cloudflare_r2: &r2
    access_key_id: 55c59e32643f220ede0d3494ea1a9c35
    bucket: ctea
    account_id: bb7bdac21855a417e8ed043d3efc6d01
    # Dev: https://pub-xxxx.r2.dev | Prod: https://media.your-domain.com
    public_url: https://pub-2bb6dae8f23943f19fe4d549fdfd5f2d.r2.dev
    prefix: homepage/

collections:
  - name: pages
    label: 頁面
    files:
      - name: homepage
        label: 首頁輪播
        file: content/homepage.json
        format: json
        fields:
          - name: carousel
            label: 首頁焦點輪播
            widget: object
            fields:
              - name: slides
                label: 輪播內容
                label_singular: 投影片
                widget: list
                min: 1
                max: 6
                summary: '{{fields.titleLine1}}{{fields.titleLine2}}'
                fields:
                  - { label: 英文分類標示, name: eyebrow, widget: string }
                  - { label: 主標題第一行, name: titleLine1, widget: string }
                  - { label: 金色主標題第二行, name: titleLine2, widget: string }
                  - { label: 說明文字, name: description, widget: text }
                  - { label: CTA 文字, name: ctaLabel, widget: string }
                  - { label: CTA 連結, name: ctaHref, widget: string }
                  - label: 背景圖片
                    name: image
                    widget: image
                    media_libraries:
                      cloudflare_r2:
                        <<: *r2
                        prefix: homepage/landingpage/
                  - { label: 圖片替代文字, name: imageAlt, widget: string }
                  - label: 圖片焦點
                    name: imagePosition
                    widget: select
                    default: center center
                    options:
                      - { label: 置中, value: center center }
                      - { label: 靠左, value: left center }
                      - { label: 靠右, value: right center }
                      - { label: 底部置中, value: center bottom }
      - name: news
        label: 最新消息
        file: content/news.json
        format: json
        fields:
          - label: 焦點消息圖片
            name: featuredImage
            widget: image
            media_libraries:
              cloudflare_r2:
                <<: *r2
                prefix: homepage/landingpage/
          - { label: 焦點消息圖片替代文字, name: featuredImageAlt, widget: string }
      - name: social
        label: 馬術現場
        file: content/social.json
        format: json
        fields:
          - label: 區塊背景圖片
            name: backgroundImage
            widget: image
            media_libraries:
              cloudflare_r2:
                <<: *r2
                prefix: homepage/landingpage/


  - name: posts
    label: Posts
    label_singular: Post
    folder: /content/posts
    create: true
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, type: date }
      - { label: Body, name: body, widget: richtext }
