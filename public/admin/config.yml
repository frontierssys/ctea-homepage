# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: bensontuan-frt/ctea-homepage

media_folder: /public/media
public_folder: /media

collections:
  - name: pages
    label: 頁面
    files:
      - name: homepage
        label: 首頁
        file: content/homepage.json
        format: json
        fields:
          - name: carousel
            label: 首頁焦點輪播
            widget: object
            fields:
              - name: slides
                label: 輪播內容
                label_singular: 投影片
                widget: list
                min: 1
                max: 6
                summary: '{{fields.titleLine1}}{{fields.titleLine2}}'
                fields:
                  - { label: 英文分類標示, name: eyebrow, widget: string }
                  - { label: 主標題第一行, name: titleLine1, widget: string }
                  - { label: 金色主標題第二行, name: titleLine2, widget: string }
                  - { label: 說明文字, name: description, widget: text }
                  - { label: CTA 文字, name: ctaLabel, widget: string }
                  - { label: CTA 連結, name: ctaHref, widget: string }
                  - { label: 背景圖片, name: image, widget: image }
                  - { label: 圖片替代文字, name: imageAlt, widget: string }
                  - label: 圖片焦點
                    name: imagePosition
                    widget: select
                    default: center center
                    options:
                      - { label: 置中, value: center center }
                      - { label: 靠左, value: left center }
                      - { label: 靠右, value: right center }
                      - { label: 底部置中, value: center bottom }


  - name: posts
    label: Posts
    label_singular: Post
    folder: /content/posts
    create: true
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, type: date }
      - { label: Body, name: body, widget: richtext }
